// a host's rinfo (engines, tmux). With no live connection to a password host: its password (pwFor), a terminal there opened in the background, then asked again
const RI={};async function rReady(hid){const h=sshH(hid),q=()=>api('/api/ssh/rinfo?host='+encodeURIComponent(hid),0,3e4).then(d=>RI[hid]=d),no=e=>/^Open a terminal/.test(e.reason||'');if(!h)throw{reason:'That host has gone.'};

 const pw=await pwFor(h);sb.innerHTML=`<h2 id=rcon>Connecting…</h2><small class=sub2>${esc(h.name)} · ${esc(sshAddr(h))}</small>`;showSheet(1);
 try{await api('/api/ssh/connect',{host:hid,...pw?{password:pw}:{}})}catch(e){throw{reason:e.reason||'Couldn\'t connect.'}}list().catch(()=>{});
 for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,1500));try{return await q()}catch(e){if(!no(e))throw e}}
 throw{reason:'Couldn\'t connect to '+h.name+'. Open its terminal to see why.'}}
// a server folder's folders (~ at first); the server's past chats, kept 20 s: {at, L: [{session, cwd, title, mtime}], err}, with p while asked
async function rFold(hid,p){const d=await api('/api/ssh/rfolders?host='+encodeURIComponent(hid)+'&path='+encodeURIComponent(p),0,3e4);if(p=='~'&&d.folders.length)RHOME[hid]=d.folders[0].replace(/\/[^/]+$/,'')||'/';return d.folders}
const RHI={};function rHist(hid){const c=RHI[hid];if(c&&(c.p||Date.now()-c.at<2e4))return c.p||Promise.resolve(c);
 return(RHI[hid]={...c,p:api('/api/ssh/rhistory?host='+encodeURIComponent(hid),0,4e4).then(d=>({L:d.history}),e=>({L:[],err:e.reason||'Couldn\'t read the past chats.'})).then(r=>RHI[hid]={...r,at:Date.now()})}).p}

 const draw=()=>{const a=ab(),t=$('rf').value.toLowerCase();$('rl').innerHTML=R.L.filter(x=>x.cwd==a&&(x.title||'').toLowerCase().includes(t)&&!sshC(hid).some(c=>c.session==x.session)).slice(0,25).map(x=>`<button class=pick data-r="${esc(x.session)}">${esc(x.title||x.session.slice(0,8))}<small>${ago(x.mtime)}</small></button>`).join('')||`<small>${R.p?'Loading…':esc(R.err||'No past chats here.')}</small>`};
 fd();draw();rHist(hid).then(r=>{R=r;if($('rfw')&&$('rfw').dataset.h==hid)draw()});if($('nw'))$('nw').onchange=()=>newChat($('nw').value?'~':null,$('nw').value);
 $('rfw').onclick=async e=>{const b=e.target.closest('[data-fd]');if(!b)return;const q=b.dataset.fd;try{F=await rFold(hid,q);p=q}catch(x){return toast(x.reason||'Couldn\'t open that folder.')}fd();draw()};
 $('rf').oninput=draw;$('rl').onclick=e=>{const b=e.target.closest('[data-r]');if(b)launch(ab(),b.dataset.r,{...optVals(),host:hid})};$('gof').onclick=()=>launch(ab(),null,{...optVals(),host:hid})}
function sshHost(hid,re){const h=sshH(hid);if(!h){if(re)hideSheet();return toast('That host has gone.')}closeMenu();const T=sshT(hid),C=sshC(hid),I=RI[hid],R=RHI[hid],P=(R&&R.L||[]).filter(x=>!C.some(c=>c.session==x.session)).slice(0,30),B=(id,t,c)=>`<button class=pick id=${id} style="text-align:center${c?';color:#e5484d':''}">${t}</button>`;

  `<div class=none>${h.lost||R&&!R.p?esc(R&&R.err||'No Claude chats yet.'):'Loading…'}</div>`}</div></section>

 ${h.lost?'':h.temp?'<button class=go id=xnt>New terminal</button>':'<div class=two><button class=go id=xnc>New Claude chat</button><button class=go id=xnt>New terminal</button></div>'}`+(h.temp?'':(pwHas(hid)?`<div class=two>${B('xed','Edit')}${B('xfg','Forget saved password')}</div>`:B('xed','Edit')))+
 (h.auth=='password'&&!h.temp&&(T.some(t=>!t.dead)||C.some(c=>!c.dropped))?B('xik','Install key (sign in without a password)'):'')+(h.lost?'':B('xrk','Remove old host key'))+(h.temp?'':B('xdl','Delete host',1))+'</div>';if(!re)showSheet(-1);
 $('xhp').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{hideSheet();stack=[];sshOpen(b.dataset.st)});$('xhp').querySelectorAll('[data-sx]').forEach(b=>twice(b,'Tap to close',()=>sshClose(b.dataset.sx)));

 if(h.lost)return;const rd=()=>{const x=$('xhp');if(x&&x.dataset.h==hid&&sh.classList.contains('on'))sshHost(hid,1)};
 if(!I)api('/api/ssh/rinfo?host='+encodeURIComponent(hid),0,3e4).then(d=>{RI[hid]=d;rd()},()=>{});if(!R||!R.p&&Date.now()-R.at>2e4)rHist(hid).then(rd);

// the terminal view's paperclip: each file goes through the Mac to the server's ~/.cache/session-deck/uploads and its path is typed at the prompt, not run
function sshAttach(files){const p=cur.pane;for(const f of files){const name=f.name||'pasted image';if(f.size>1<<30){toast(name+' is over 1 GB. Move very large files with Syncthing instead.');continue}
 const x=new XMLHttpRequest();x.open('POST','api/upload?pane='+encodeURIComponent(p)+'&name='+encodeURIComponent(name));x.setRequestHeader('X-Deck-Token',TOK);
 x.upload.onprogress=e=>{if(e.lengthComputable)toast(name+': '+Math.round(e.loaded*100/e.total)+'%')};x.onerror=()=>toast(name+': upload failed. Check the connection.');
 x.onload=async()=>{let r={};try{r=JSON.parse(x.responseText)}catch(e){}if(x.status!=200||!r.path)return toast(r.error||name+': upload failed ('+x.status+').');

function sshGet(){const p=cur.pane,h=sshH(cur.host);sb.innerHTML=`<h2>Get a file</h2><small class=sub2>From ${esc(h?h.name:'the server')}, up to 1 GB, to open or save here.</small>
